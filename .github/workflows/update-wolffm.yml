name: Auto-update @wolffm packages

# NO `schedule:` TRIGGER HERE — deliberate, do not add one back.
#
# The daily safety net moved to hadoku_site's cron-worker, where a Temporal
# schedule fires ON TIME: `services/cron-worker/profiles.json` -> repo-sync
# profile (13:00 UTC / 06:00 Pacific, the last daily profile) -> tail job
# `ci:wolffm-fanout` -> `services/mgmt-api/src/routes/jobs/wolffm-fanout.ts`,
# which dispatches `wolffm_published` to every consumer in child-apps.json.
# That job throws on a non-204, so a dropped dispatch pages Discord — louder
# than this cron ever was, since a failed CI fan-out only emits a warning and
# leaves its run green.
#
# A GitHub Actions `schedule` is the wrong trigger for anything that ends in a
# deploy, because it does not fire when it says it does. Measured across 46
# runs of this same `0 */6 * * *` expression in hadoku-watchparty: median
# +57min late, max +162min, worst at the 00:00 UTC slot (median +105min)
# because midnight UTC is the most contended cron minute on the platform.
# 00:00 UTC is 17:00 Pacific — on 2026-08-10 that slot landed at 18:52 Pacific
# and redeployed production into a live watch party.
#
# Fast path is unchanged: a publish still dispatches `wolffm_published`
# immediately via hadoku_site's update-packages.yml fan-out.
on:
  repository_dispatch:
    types: [wolffm_published]
  workflow_dispatch:

concurrency:
  group: update-wolffm
  cancel-in-progress: true

permissions:
  contents: write   # GITHUB_TOKEN pushes bot/update-wolffm; it cannot push protected main
  packages: read
  issues: write

jobs:
  update:
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    timeout-minutes: 10
    steps:
      - name: Mark the start, so the reported duration is real
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      # The DEFAULT token, deliberately: the bump is pushed to bot/update-wolffm
      # and mgmt-api fast-forwards main onto it (hadoku-actions/update-wolffm), so
      # this repo holds no credential that can push main or reach another repo.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: WolffM/hadoku-actions/update-wolffm@v1
        with:
          service-key: ${{ secrets.KEY_SERVICE_JOBPLATFORM }}
          npm-token: ${{ secrets.HADOKU_NPM_READ_TOKEN }}
          # The theme-token gate against the packages just bumped, before anything
          # is pushed. Nothing else checks a bump before main moves, and a new
          # @wolffm/themes can tighten check-usage: themes 5.12.6 landed 40
          # violations on hadoku_site main with every check green.
          verify: pnpm run lint:css

      # A red run here means the update pipeline is FROZEN — no @wolffm package
      # (themes, worker-utils, security fixes) lands until someone acts. The
      # 2026-08-03/04 incident (docs/incident-2026-08-04-ci-failures.md) sat
      # red for ~19h because the only signal was the next morning's CI digest.
      # An issue notifies the owner within minutes and self-closes on recovery.
      - name: Open/refresh alert issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Auto-update @wolffm packages is red"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still red: $run_url"
          else
            gh issue create --title "$title" --body "$(printf 'The auto-update workflow is failing, so @wolffm package updates are frozen until this is fixed.\n\nFirst red run: %s\n\nThis issue closes itself when a run goes green. Playbook: docs/incident-2026-08-04-ci-failures.md' "$run_url")"
          fi

      # continue-on-error: this is tidy-up, not the payload. Before this was
      # added, a transient `gh issue list`/`close` hiccup here (rate limit,
      # network blip) failed THIS step under the default `bash -e`, which
      # flips the whole job red — so a genuinely successful @wolffm update
      # paged @here over a failed issue-close, not a failed update. (P6.7)
      - name: Close alert issue on recovery
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Auto-update @wolffm packages is red"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          [ -z "$existing" ] && exit 0
          gh issue close "$existing" --comment "Recovered: $run_url"

      # A red run is seen by nobody unless it says so itself: nothing polls
      # these repos. `always()` so RECOVERIES report too -- without the success
      # side the alert state stays broken and the next real failure arrives as a
      # suppressed reminder rather than a new alert.
      - name: Report the outcome so a silent failure can't hide
        if: always()
        uses: WolffM/hadoku-actions/report-job@v1
        with:
          job-name: jobplatform:update-wolffm
          service-key: ${{ secrets.KEY_SERVICE_JOBPLATFORM }}
          started-at: ${{ env.JOB_STARTED_AT }}
