name: CI

# This repo had NO pull-request CI: publish.yml and update-wolffm.yml run on
# push to main, so nothing has ever verified a pull request here. Its only gate
# was .husky/pre-commit, which `prepare: husky` builds from a gitignored
# .husky/_ that does not exist on a CI runner — so it never ran there either,
# and a git worktree never has it locally.
#
# The commands are the ones already in package.json. Nothing invented.
#
# DELIBERATELY UNFILTERED on pull_request. A required check that never runs
# never reports, and auto-merge waits only on required checks — so a `paths:`
# filter is a gate that is ABSENT on some PRs (they merge unverified) and FATAL
# on others (they wait forever). Scoping lives in the scope steps below, which
# always report.
on:
  pull_request:
  # Direct pushes to main are the path almost every commit here actually takes:
  # `enforce_admins: false` on the branch is deliberate, so the required check
  # does not apply to them, and without this trigger that path was verified by
  # nothing at all. This is a smoke alarm, not a gate — the deploy/publish
  # workflow fires on the same push regardless. It makes a red main visible
  # instead of silent. The job's scope step already forces run=true for any
  # non-pull_request event, so no other change is needed.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  typecheck:
    name: typecheck
    # HOSTED, DELIBERATELY — do not point this workflow at the self-hosted
    # builder, and do not restore the `vars.CI_RUNNER || ...` fallback here.
    #
    # This repo is public and this is the ONLY workflow a fork can trigger
    # (`pull_request` above). The workflow file itself comes from the base
    # branch, so a fork cannot edit these steps — but `pnpm install` and
    # `pnpm run typecheck` execute scripts out of the PR's own package.json.
    # On the self-hosted builder that is arbitrary code as the runner's user,
    # with its home directory, credentials and other checkouts in reach.
    #
    # Hardcoded rather than defaulted because `CI_RUNNER` is a plausible thing
    # to set for speed later, and doing so would silently reopen that path.
    # publish / update-wolffm / vibecompact are not fork-reachable and still
    # honour CI_RUNNER.
    # Runner SELECTION, not a job-level `if:`. Skipping the job would make a
    # required check that never reports, so a fork PR could never merge. This
    # keeps it always-running while an unauthorized fork PR lands on
    # GitHub-hosted (free here) instead of a claw — a persistent machine on a
    # home LAN. author_association is computed by GitHub, not the submitter.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) && '["ubuntu-latest"]') || vars.CI_RUNNER) }}
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 — the scope step diffs against the PR base, and a
      # shallow clone has no common ancestor to diff with.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Does this diff need typechecking?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")"
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qE '(^src/|^worker/|^scripts/|package\.json|pnpm-lock\.yaml|tsconfig|eslint\.config|stylelintrc|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "→ nothing typecheckable touched."
          fi

      # setup-node BEFORE corepack: `corepack enable` symlinks its shims next
      # to the active node, and without setup-node that is the host's /usr/bin,
      # which the runner user cannot write.
      - uses: WolffM/hadoku-actions/setup-pnpm@v1
        with:
          npm-token: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Install
        if: steps.scope.outputs.run == 'true'
        run: pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Typecheck
        if: steps.scope.outputs.run == 'true'
        run: pnpm run typecheck

  lint:
    name: lint
    # Hosted, deliberately — see the typecheck job above.
    # Runner SELECTION, not a job-level `if:`. Skipping the job would make a
    # required check that never reports, so a fork PR could never merge. This
    # keeps it always-running while an unauthorized fork PR lands on
    # GitHub-hosted (free here) instead of a claw — a persistent machine on a
    # home LAN. author_association is computed by GitHub, not the submitter.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) && '["ubuntu-latest"]') || vars.CI_RUNNER) }}
    timeout-minutes: 15
    # Published so the `report` job can quote a real duration. Both jobs start
    # together, so either one's start is the run's start; lint already had the
    # marker, so it is the one that exports it.
    outputs:
      started-at: ${{ steps.start.outputs.epoch }}
    steps:
      # fetch-depth: 0 — the scope step diffs against the PR base, and a
      # shallow clone has no common ancestor to diff with.
      - name: Mark the start, so the reported duration is real
        id: start
        run: echo "epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Does this diff need linting?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")"
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qE '(^src/|^worker/|^scripts/|package\.json|pnpm-lock\.yaml|tsconfig|eslint\.config|stylelintrc|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "→ nothing lintable touched."
          fi

      # setup-node BEFORE corepack: `corepack enable` symlinks its shims next
      # to the active node, and without setup-node that is the host's /usr/bin,
      # which the runner user cannot write.
      - uses: actions/setup-node@v6
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@wolffm'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      # corepack, not pnpm/action-setup — the self-installer intermittently
      # dies on this runner with `ENOENT ... uv_cwd`.
      - name: Enable pnpm
        if: steps.scope.outputs.run == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate

      - name: Install
        if: steps.scope.outputs.run == 'true'
        run: pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: ESLint
        if: steps.scope.outputs.run == 'true'
        run: pnpm run lint
      - name: Stylelint + theme-token gate
        if: steps.scope.outputs.run == 'true'
        run: pnpm run lint:css

  # ONE report per RUN, not one per job — and this is a correctness constraint,
  # not tidiness.
  #
  # `POST /health/api/jobs` upserts the execution row on run_id ALONE
  # (monitoring-api migration 0007: `CREATE UNIQUE INDEX idx_jobs_run_id ON
  # job_executions(run_id)`, and `ON CONFLICT(run_id) DO UPDATE` in
  # job-store.ts). typecheck and lint are two jobs in ONE workflow file, so they
  # share this run's id: a report step in each would upsert the SAME row, and
  # whichever finished last would overwrite the other's verdict. A green lint
  # would erase a red typecheck — the exact silence the reporting exists to end.
  # site:typecheck / site:lint get away with per-job names only because they sit
  # in separate workflow FILES, which means separate runs.
  #
  # Until now only lint reported at all, so a typecheck-only failure on main was
  # already invisible. This closes that without opening the clobber.
  #
  # No checkout: report-job is REFERENCED, not vendored, so the runner fetches
  # it before the first step. Hosted, because this is one curl and a claw is a
  # scarce shared resource. On a fork PR the service key is absent and the
  # action warns and skips, which is the intended behaviour.
  report:
    name: report
    needs: [typecheck, lint]
    # `always()` so RECOVERIES report too -- without the success side the alert
    # state stays broken and the next real failure arrives as a suppressed
    # reminder rather than a new alert.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the outcome so a silent failure can't hide
        uses: WolffM/hadoku-actions/report-job@v1
        with:
          job-name: jobplatform:ci
          service-key: ${{ secrets.KEY_SERVICE_JOBPLATFORM }}
          started-at: ${{ needs.lint.outputs.started-at }}
          # Cancelled is checked FIRST and deliberately wins over failure: a
          # superseded run is not breakage, and report-job stays silent on it
          # rather than clearing a live failure streak.
          outcome: >-
            ${{ (contains(needs.*.result, 'cancelled') && 'cancelled')
                || (contains(needs.*.result, 'failure') && 'failure')
                || 'success' }}
          error-message: >-
            jobplatform CI failed (typecheck=${{ needs.typecheck.result }},
            lint=${{ needs.lint.result }}) —
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
