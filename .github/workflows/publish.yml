name: Publish & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# ============================================================
# Deploy Configuration
# ============================================================
# PACKAGE_NAME:        npm package published by this repo (always set)
# WORKER_PACKAGE_NAME: worker package name, if this repo also publishes a worker
#                      (leave empty if no worker)
# PM2_SERVICE_NAME:    PM2 service to redeploy on hadoku-server
#                      (leave empty if no tunnel service)
env:
  PACKAGE_NAME: "@wolffm/jobplatform"
  WORKER_PACKAGE_NAME: "@wolffm/jobplatform-worker"
  PM2_SERVICE_NAME: ""

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@wolffm"

      # pnpm via corepack, pinned by the `packageManager` field in package.json.
      # Replaces pnpm/action-setup, whose self-installer shares one directory
      # across every runner instance on the host and dies with
      # `ENOENT ... uv_cwd` when concurrent jobs race it.
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Build UI package
        run: pnpm run build

      - name: Build worker package
        run: pnpm --filter @wolffm/jobplatform-worker run build

      - name: Check if UI package changed
        id: ui_changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qv '^worker/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if worker package changed
        id: worker_changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^worker/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check and bump UI version if needed
        if: steps.ui_changed.outputs.changed == 'true'
        run: |
          package_name=$(node -p "require('./package.json').name")
          current_version=$(node -p "require('./package.json').version")
          echo "Current version: $current_version"
          # Loop until we find an unpublished version. Single-step bump is
          # insufficient: if the pre-commit hook was skipped and a prior CI
          # run already burned current+1, we'd write a duplicate version and
          # pnpm publish silently no-ops ("There are no new packages").
          # Start the walk from the registry's latest, not package.json: CI
          # bumps are published but never committed back, so the committed
          # version only falls behind — and this walk used to replay the whole
          # gap one version at a time on every publish (tenhands died at
          # attempt 99 of exactly that on 2026-08-05). From latest, one step.
          latest_published=$(pnpm view "${package_name}" version 2>/dev/null || echo "")
          if [ -n "$latest_published" ]; then
            new_version=$(printf '%s\n%s\n' "$current_version" "$latest_published" | sort -V | tail -1)
            echo "Registry latest: $latest_published; starting walk at $new_version"
          else
            echo "No published version found; starting from package.json"
            new_version="$current_version"
          fi
          max_attempts=10
          attempt=0
          while pnpm view "${package_name}@${new_version}" version 2>/dev/null; do
            attempt=$((attempt + 1))
            if [ $attempt -ge $max_attempts ]; then
              echo "ERROR: $max_attempts consecutive published versions from $new_version — from the registry's latest this should take one step, so the registry lookup most likely failed"
              exit 1
            fi
            echo "Version $new_version already published, bumping... ($attempt/$max_attempts)"
            major=$(echo $new_version | cut -d. -f1)
            minor=$(echo $new_version | cut -d. -f2)
            patch=$(echo $new_version | cut -d. -f3)
            if [ $patch -ge 20 ]; then
              new_minor=$((minor + 1))
              new_version="$major.$new_minor.0"
            else
              new_patch=$((patch + 1))
              new_version="$major.$minor.$new_patch"
            fi
          done
          if [ "$new_version" != "$current_version" ]; then
            node -e "const fs = require('fs'); const p = 'package.json'; const src = fs.readFileSync(p, 'utf8'); const next = src.replace(/(\"version\"\s*:\s*\")[^\"]*(\")/, (m, a, b) => a + process.argv[1] + b); if (next === src) { console.error('could not patch version in ' + p); process.exit(1); } fs.writeFileSync(p, next);" "$new_version"
            echo "Version bumped: $current_version -> $new_version"
            pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --lockfile-only
          else
            echo "Version $current_version not published yet"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Check and bump worker version if needed
        if: steps.worker_changed.outputs.changed == 'true'
        run: |
          package_name=$(node -p "require('./worker/package.json').name")
          current_version=$(node -p "require('./worker/package.json').version")
          echo "Current worker version: $current_version"
          # See UI bump step for the rationale on looping.
          # Start the walk from the registry's latest, not package.json: CI
          # bumps are published but never committed back, so the committed
          # version only falls behind — and this walk used to replay the whole
          # gap one version at a time on every publish (tenhands died at
          # attempt 99 of exactly that on 2026-08-05). From latest, one step.
          latest_published=$(pnpm view "${package_name}" version 2>/dev/null || echo "")
          if [ -n "$latest_published" ]; then
            new_version=$(printf '%s\n%s\n' "$current_version" "$latest_published" | sort -V | tail -1)
            echo "Registry latest: $latest_published; starting walk at $new_version"
          else
            echo "No published version found; starting from package.json"
            new_version="$current_version"
          fi
          max_attempts=10
          attempt=0
          while pnpm view "${package_name}@${new_version}" version 2>/dev/null; do
            attempt=$((attempt + 1))
            if [ $attempt -ge $max_attempts ]; then
              echo "ERROR: $max_attempts consecutive published versions from $new_version — from the registry's latest this should take one step, so the registry lookup most likely failed"
              exit 1
            fi
            echo "Version $new_version already published, bumping... ($attempt/$max_attempts)"
            major=$(echo $new_version | cut -d. -f1)
            minor=$(echo $new_version | cut -d. -f2)
            patch=$(echo $new_version | cut -d. -f3)
            if [ $patch -ge 20 ]; then
              new_minor=$((minor + 1))
              new_version="$major.$new_minor.0"
            else
              new_patch=$((patch + 1))
              new_version="$major.$minor.$new_patch"
            fi
          done
          if [ "$new_version" != "$current_version" ]; then
            node -e "const fs = require('fs'); const p = 'worker/package.json'; const src = fs.readFileSync(p, 'utf8'); const next = src.replace(/(\"version\"\s*:\s*\")[^\"]*(\")/, (m, a, b) => a + process.argv[1] + b); if (next === src) { console.error('could not patch version in ' + p); process.exit(1); } fs.writeFileSync(p, next);" "$new_version"
            echo "Worker version bumped: $current_version -> $new_version"
            pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --lockfile-only
          else
            echo "Version $current_version not published yet"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Publish UI package
        if: steps.ui_changed.outputs.changed == 'true'
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish worker package
        if: steps.worker_changed.outputs.changed == 'true'
        run: pnpm --filter @wolffm/jobplatform-worker publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify parent about deployment
        if: steps.ui_changed.outputs.changed == 'true' || steps.worker_changed.outputs.changed == 'true'
        env:
          # Without this the guard below reads an unset variable, takes the
          # "skipping notifications" branch and exits 0 — so the publish goes
          # green while hadoku_site is never told, and the worker (with any D1
          # migration riding on it) silently never deploys. Every other repo in
          # the fleet wires it here; this one did not.
          HADOKU_SITE_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}
          HADOKU_NPM_READ_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}
        run: |
          if [ -z "$HADOKU_SITE_TOKEN" ]; then
            echo "Warning: HADOKU_SITE_TOKEN not available, skipping notifications"
            exit 0
          fi

          API_URL="https://api.github.com/repos/WolffM/hadoku_site/dispatches"
          AUTH_HEADER="Authorization: Bearer $HADOKU_SITE_TOKEN"

          # Announce EXACTLY what was published, never what merely exists.
          #
          # This used to name the UI package unconditionally and the worker
          # package whenever WORKER_PACKAGE_NAME was non-empty — neither of which
          # is "did it publish". The consumer then updates a package that did not
          # change, and for a never-published one hadoku_site's Update Packages
          # dies with a 404 on `Fail on partial package update`.
          #
          # Both packages here are published, so this was the quiet variant: a
          # UI-only release still announced the worker, and hadoku_site dutifully
          # "updated" something that had not moved. hadoku-study hit the loud
          # variant of the same line (its worker has never published, so every
          # release reddened the parent) and fixed it 2026-08-18; the scaffolder
          # template was fixed the same day. This is the same fix, byte-identical.
          #
          # Both `changed` outputs are exactly the conditions the publish steps
          # above are gated on, so the dispatch cannot disagree with reality.
          PACKAGES=""
          if [ "${{ steps.ui_changed.outputs.changed }}" = "true" ]; then
            PACKAGES="\"$PACKAGE_NAME\""
          fi
          if [ -n "$WORKER_PACKAGE_NAME" ] && [ "${{ steps.worker_changed.outputs.changed }}" = "true" ]; then
            [ -n "$PACKAGES" ] && PACKAGES="$PACKAGES, "
            PACKAGES="$PACKAGES\"$WORKER_PACKAGE_NAME\""
          fi
          if [ -z "$PACKAGES" ]; then
            echo "Nothing was published — no dispatch."
            exit 0
          fi

          # Dispatch packages_updated (triggers update-packages → deploy)
          echo "Dispatching packages_updated: [$PACKAGES]"
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST "$API_URL" \
            -H "Accept: application/vnd.github+json" \
            -H "$AUTH_HEADER" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"event_type\": \"packages_updated\", \"client_payload\": {\"packages\": [$PACKAGES], \"sha\": \"${{ github.sha }}\", \"ref\": \"${{ github.ref }}\"}}")

          if [ "$status" = "204" ]; then
            echo "  packages_updated dispatched"
          else
            echo "  Failed to dispatch packages_updated (HTTP $status)"
          fi

          # Dispatch PM2 redeploy if configured
          if [ -n "$PM2_SERVICE_NAME" ]; then
            echo "Dispatching redeploy_service: $PM2_SERVICE_NAME"
            status=$(curl -sS -o /dev/null -w "%{http_code}" \
              -X POST "$API_URL" \
              -H "Accept: application/vnd.github+json" \
              -H "$AUTH_HEADER" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "{\"event_type\": \"redeploy_service\", \"client_payload\": {\"service\": \"$PM2_SERVICE_NAME\", \"sha\": \"${{ github.sha }}\"}}")

            if [ "$status" = "204" ]; then
              echo "  redeploy_service dispatched"
            else
              echo "  Failed to dispatch redeploy_service (HTTP $status)"
            fi
          fi
