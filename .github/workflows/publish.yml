name: Publish & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# ============================================================
# Deploy Configuration
# ============================================================
# PACKAGE_NAME:        npm package published by this repo (always set)
# WORKER_PACKAGE_NAME: worker package name, if this repo also publishes a worker
#                      (leave empty if no worker)
# PM2_SERVICE_NAME:    PM2 service to redeploy on hadoku-server
#                      (leave empty if no tunnel service)
env:
  PACKAGE_NAME: '@wolffm/jobplatform'
  WORKER_PACKAGE_NAME: '@wolffm/jobplatform-worker'
  PM2_SERVICE_NAME: ''

permissions:
  contents: read
  packages: write
  # Read this workflow's own run history: the change check reaches back to
  # the last commit a publish succeeded on.
  actions: read

# One publish at a time. Two overlapping runs walk the registry to the same
# next version and the newer commit dies 409 unpublished
# (hadoku-dataplatform#31). Never cancel-in-progress: a run stopped between
# publishing and notifying ships a release hadoku_site never hears about.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    steps:
      - name: Mark the start, so the reported duration is real
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          # The whole history, because "what changed" is measured across the
          # PUSH and a push can be any number of commits. See the range step.
          fetch-depth: 0

      - uses: WolffM/hadoku-actions/setup-pnpm@v1
        id: pnpm
        with:
          npm-token: ${{ secrets.HADOKU_NPM_READ_TOKEN }}
          vault-key: ${{ secrets.KEY_SERVICE_JOBPLATFORM }}

      - name: Install dependencies
        run: pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ steps.pnpm.outputs.npm-token }}

      - name: Build UI package
        run: pnpm run build

      - name: Build worker package
        run: pnpm --filter @wolffm/jobplatform-worker run build

      # What this PUSH introduced, as a diff range.
      #
      # `HEAD~1 HEAD` is the last COMMIT, and a push is not one commit. Push
      # three commits where the worker changes in the first and a chore lands
      # last, and the worker publish is silently skipped — the UI ships the new
      # feature and the worker that implements it never leaves the runner.
      #
      # It fails QUIETLY by construction: the publish, the registry
      # verification and the dispatch to hadoku_site are all gated on the two
      # outputs below, so they agree with each other and none of them agrees
      # with the push. Green run, published UI, an API that 400s on the thing
      # the UI now offers. It has happened at least twice — hadoku-meet
      # 2026-08-18 (fixed there, never brought back here, which is why every
      # repo scaffolded since was born with it) and hadoku-hopper 2026-09-01,
      # where a two-commit push carried an Esri basemap swap in the first
      # commit and a docs fix in the second.
      #
      # `github.event.before` is the tip before the push, the only base that
      # covers every commit in it. A manual dispatch has no push and publishes
      # everything — see the step.
      - name: Resolve the range this push introduced
        id: range
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A manual dispatch is an explicit "publish now". It exists to recover
          # a publish that was skipped, so the change check must never veto it:
          # diffing HEAD~1 here would skip the same worker the stranded push
          # skipped, and the only way out would be a no-op commit under worker/.
          # Both checks below read publish_all before they diff anything.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual dispatch: publishing every package unconditionally"
            echo "publish_all=true" >> $GITHUB_OUTPUT
            echo "base=HEAD~1" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "publish_all=false" >> $GITHUB_OUTPUT

          base="$BEFORE"
          # A branch's first push sends the all-zero sha; a force-push can name
          # a commit that is no longer reachable. Fall back to the last commit
          # in both cases — a narrower range than the truth, but never a broken
          # one.
          if [ -z "$base" ] \
            || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable push base ('$base'); falling back to HEAD~1"
            base="HEAD~1"
          fi
          # The concurrency group keeps ONE run waiting, so a third push cancels it
          # and its range is never diffed; a failed run strands its range too. Reach
          # back to the last commit a publish SUCCEEDED on when that is older than the
          # push base (hadoku-dataplatform#31). An unreadable history keeps the base.
          last=$(node -e '
            const file = process.env.GITHUB_WORKFLOW_REF.split("@")[0].split("/").pop();
            const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}` +
              `/actions/workflows/${file}/runs?status=success&per_page=1` +
              `&branch=${encodeURIComponent(process.env.GITHUB_REF_NAME)}`;
            fetch(url, { headers: { authorization: `Bearer ${process.env.GH_TOKEN}`,
                                    accept: "application/vnd.github+json" } })
              .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
              .then(j => console.log(j.workflow_runs[0]?.head_sha ?? ""))
              .catch(e => { console.error(e.message); process.exit(1); });
          ') || { echo "::warning::Could not read the last successful publish; using the push base"; last=""; }
          if [ -n "$last" ] && git cat-file -e "${last}^{commit}" 2>/dev/null \
            && [ "$(git rev-parse "$last")" != "$(git rev-parse "$base")" ] \
            && git merge-base --is-ancestor "$last" "$base"; then
            echo "Last successful publish was ${last}, before the push base: widening the range to it"
            base="$last"
          fi
          echo "base=$base" >> $GITHUB_OUTPUT
          echo "Comparing ${base}..HEAD:"
          git diff --name-only "$base" HEAD

      - name: Check if UI package changed
        id: ui_changed
        env:
          BASE: ${{ steps.range.outputs.base }}
          PUBLISH_ALL: ${{ steps.range.outputs.publish_all }}
        run: |
          if [ "$PUBLISH_ALL" = "true" ] || git diff --name-only "$BASE" HEAD | grep -qv '^worker/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if worker package changed
        id: worker_changed
        env:
          BASE: ${{ steps.range.outputs.base }}
          PUBLISH_ALL: ${{ steps.range.outputs.publish_all }}
        run: |
          if [ "$PUBLISH_ALL" = "true" ] || git diff --name-only "$BASE" HEAD | grep -q '^worker/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # The version is CI's, never a commit's (operator, 2026-11-01): one patch
      # above the registry's newest, written to package.json in this workspace
      # only and never committed back. A committed version ABOVE the registry is
      # kept, so a deliberate minor or major bump still works. An unreadable
      # registry FAILS here rather than guess. `published == 'true'` means this
      # very commit already published the newest version (a re-run after a later
      # step failed): skip the publish and redo what follows it.
      - name: Version the UI package
        id: ui_version
        if: steps.ui_changed.outputs.changed == 'true'
        uses: WolffM/hadoku-actions/next-version@v1
        env:
          NODE_AUTH_TOKEN: ${{ steps.pnpm.outputs.npm-token }}

      - name: Version the worker package
        id: worker_version
        if: steps.worker_changed.outputs.changed == 'true'
        uses: WolffM/hadoku-actions/next-version@v1
        with:
          package-dir: worker
        env:
          NODE_AUTH_TOKEN: ${{ steps.pnpm.outputs.npm-token }}

      - name: Publish UI package
        if: steps.ui_changed.outputs.changed == 'true' && steps.ui_version.outputs.published != 'true'
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish worker package
        if: steps.worker_changed.outputs.changed == 'true' && steps.worker_version.outputs.published != 'true'
        run: pnpm --filter @wolffm/jobplatform-worker publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # hadoku_site is told through mgmt-api with this repo's own service key
      # (hadoku-actions/repo-action), so this repo holds no token that can
      # write to hadoku_site. A refused or unanswered notify FAILS this job:
      # the old curl only warned, and a dropped dispatch means a release that
      # never reaches the site.
      - name: Which packages were published
        id: published
        if: steps.ui_changed.outputs.changed == 'true' || steps.worker_changed.outputs.changed == 'true'
        run: |
          # Announce EXACTLY what was published, never what merely exists.
          #
          # This used to name the UI package unconditionally and the worker
          # package whenever WORKER_PACKAGE_NAME was non-empty — neither of which
          # is "did it publish". The consumer then updates a package that did not
          # change, and for a never-published one hadoku_site's Update Packages
          # dies with a 404 on `Fail on partial package update`.
          #
          # Both packages here are published, so this was the quiet variant: a
          # UI-only release still announced the worker, and hadoku_site dutifully
          # "updated" something that had not moved. hadoku-study hit the loud
          # variant of the same line (its worker has never published, so every
          # release reddened the parent) and fixed it 2026-08-18; the scaffolder
          # template was fixed the same day. This is the same fix, byte-identical.
          #
          # Both `changed` outputs are exactly the conditions the publish steps
          # above are gated on, so the dispatch cannot disagree with reality.
          PACKAGES=""
          if [ "${{ steps.ui_changed.outputs.changed }}" = "true" ]; then
            PACKAGES="\"$PACKAGE_NAME\""
          fi
          if [ -n "$WORKER_PACKAGE_NAME" ] && [ "${{ steps.worker_changed.outputs.changed }}" = "true" ]; then
            [ -n "$PACKAGES" ] && PACKAGES="$PACKAGES, "
            PACKAGES="$PACKAGES\"$WORKER_PACKAGE_NAME\""
          fi
          if [ -z "$PACKAGES" ]; then
            echo "Nothing was published — no dispatch."
          else
            echo "packages=[$PACKAGES]" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify hadoku_site (packages_updated)
        if: steps.published.outputs.packages != ''
        uses: WolffM/hadoku-actions/repo-action@v1
        with:
          verb: notify
          body: '{"event_type":"packages_updated","client_payload":{"packages":${{ steps.published.outputs.packages }},"sha":"${{ github.sha }}"}}'
          service-key: ${{ secrets.KEY_SERVICE_JOBPLATFORM }}

      - name: Ask hadoku_site to redeploy the PM2 service
        if: steps.published.outputs.packages != '' && env.PM2_SERVICE_NAME != ''
        uses: WolffM/hadoku-actions/repo-action@v1
        with:
          verb: notify
          body: '{"event_type":"redeploy_service","client_payload":{"service":"${{ env.PM2_SERVICE_NAME }}","sha":"${{ github.sha }}"}}'
          service-key: ${{ secrets.KEY_SERVICE_JOBPLATFORM }}

      # The same bytes again on npmjs as @hadoku/*, so a repo outside the fleet
      # can install them without a GitHub token (hadoku_site
      # docs/operations/NPMJS_PUBLISHING.md). AFTER the notify, so an npmjs
      # problem never holds back a fleet release.
      - name: Stage the UI package for npmjs
        if: steps.ui_changed.outputs.changed == 'true'
        uses: WolffM/hadoku-actions/publish-npmjs@v1
        with:
          package-dir: .

      - name: Stage the worker package for npmjs
        if: steps.worker_changed.outputs.changed == 'true'
        uses: WolffM/hadoku-actions/publish-npmjs@v1
        with:
          package-dir: worker

      # A red run is seen by nobody unless it says so itself: nothing polls
      # these repos. `always()` so RECOVERIES report too -- without the success
      # side the alert state stays broken and the next real failure arrives as a
      # suppressed reminder rather than a new alert.
      - name: Report the outcome so a silent failure can't hide
        if: always()
        uses: WolffM/hadoku-actions/report-job@v1
        with:
          job-name: jobplatform:publish
          service-key: ${{ secrets.KEY_SERVICE_JOBPLATFORM }}
          started-at: ${{ env.JOB_STARTED_AT }}

  # npmjs publishes through trusted publishing, which refuses self-hosted
  # runners: the publish job above staged the gated tarballs, and this hosted
  # job (no checkout, no secret) hands them to npm. Both
  # @hadoku/* packages trust exactly this repo and workflow file.
  npmjs:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      actions: read
    outputs:
      started-at: ${{ steps.start.outputs.at }}
    steps:
      - name: Mark the start, for npmjs-report's duration
        id: start
        run: echo "at=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - uses: WolffM/hadoku-actions/publish-npmjs/publish@v1

  # This job cannot report for itself: Cloudflare's Bot Fight Mode challenges
  # every request from a GitHub-hosted runner to hadoku.me (403,
  # cf-mitigated: challenge) before any worker runs, so its report never
  # landed. Our runner reports the hosted job's result instead.
  npmjs-report:
    needs: npmjs
    if: always()
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    timeout-minutes: 5
    steps:
      - name: Carry the hosted job's start, so the reported duration is real
        run: echo "JOB_STARTED_AT=${{ needs.npmjs.outputs.started-at }}" >> "$GITHUB_ENV"

      - name: Report the outcome so a silent failure can't hide
        if: always()
        uses: WolffM/hadoku-actions/report-job@v1
        with:
          job-name: jobplatform:publish-npmjs
          outcome: ${{ needs.npmjs.result }}
          service-key: ${{ secrets.KEY_SERVICE_JOBPLATFORM }}
          started-at: ${{ env.JOB_STARTED_AT }}
