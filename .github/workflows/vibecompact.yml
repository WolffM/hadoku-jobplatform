name: vibeCompact

on:
  workflow_dispatch:
  # Daily schedule was disabled 2026-08-24 after every repo carrying this workflow
  # fired at the SAME minute (06:00 UTC) — a synchronised fleet-wide fan-out onto
  # claws that each share one pnpm store across ~28 runner instances, which
  # corrupted the pnpm stores on claw-2 and claw-3 and took the site's CI down for
  # roughly an hour. Restored 2026-09-07 (P6.6) on a DIFFERENT minute per repo —
  # do not move this back to :00.
  schedule:
    - cron: "3 6 * * *" # daily poll; the activity gate exits in seconds when quiet

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  audit:
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    steps:
      - name: Checkout (full history — the audit reads git forensics)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run vibeCompact
        uses: WolffM/vibecheck@main
        with:
          mode: audit
          github_token: ${{ secrets.GITHUB_TOKEN }}
