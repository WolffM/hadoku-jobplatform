<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Job Platform - Dev</title>
  <script>
    (function() {
      try {
        const savedTheme = sessionStorage.getItem('hadoku-theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme || (prefersDark ? 'dark' : 'light');

        document.documentElement.setAttribute('data-theme', theme);

        console.log('[theme-init] Applied initial theme:', {
          theme,
          savedTheme,
          prefersDark,
          source: savedTheme ? 'sessionStorage' : prefersDark ? 'browser-preference' : 'default'
        });
      } catch (err) {
        console.error('[theme-init] Failed to set initial theme:', err);
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { mount } from './src/entry.tsx'

    // Dev harness only. Production never accepts URL keys — mf-loader injects
    // sessionId after fetching /session/whoami, the cookie path handles it.
    //
    // Here in dev, we let the developer paste their key as ?apiKey=… and we
    // exchange it for a sessionId by calling /session/create (proxied via
    // vite to hadoku.me). The MFE then uses the sessionId via X-Session-Id
    // for the rest of the session — same code path as production.
    const params = new URLSearchParams(window.location.search)
    const theme = params.get('theme') || undefined
    const apiKey = params.get('apiKey') || undefined

    let sessionId
    if (apiKey) {
      try {
        const resp = await fetch('/session/create', {
          method: 'POST',
          headers: { 'X-User-Key': apiKey }
        })
        if (resp.ok) {
          const data = await resp.json()
          sessionId = data.sessionId
          console.log('[dev-auth] /session/create ok', {
            userType: data.userType,
            sessionIdPrefix: sessionId ? sessionId.slice(0, 8) + '…' : null
          })
        } else {
          console.warn('[dev-auth] /session/create failed', { status: resp.status })
        }
      } catch (err) {
        console.error('[dev-auth] /session/create threw', err)
      }
    }

    console.log('[mount] Mounting job-platform', { theme, hasSession: !!sessionId })

    mount(document.getElementById('app'), {
      theme,
      sessionId
    })
  </script>
</body>
</html>
