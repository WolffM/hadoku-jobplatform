<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>__HADOKU_APP_NAME__ - Dev</title>
  <script>
    (function() {
      try {
        const savedTheme = sessionStorage.getItem('hadoku-theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme || (prefersDark ? 'dark' : 'light');

        document.documentElement.setAttribute('data-theme', theme);

        console.log('[theme-init] Applied initial theme:', {
          theme,
          savedTheme,
          prefersDark,
          source: savedTheme ? 'sessionStorage' : prefersDark ? 'browser-preference' : 'default'
        });
      } catch (err) {
        console.error('[theme-init] Failed to set initial theme:', err);
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { mount } from './src/entry.tsx'

    // Dev harness only. Production never accepts URL keys: mf-loader passes
    // userType from /session/whoami and the hadoku_session cookie does the rest.
    //
    // Here in dev, ?apiKey=… is exchanged for that same cookie by calling
    // /session/create (proxied via vite to hadoku.me, which rewrites the
    // cookie onto localhost). Every later request authenticates by cookie —
    // same code path as production.
    const params = new URLSearchParams(window.location.search)
    const theme = params.get('theme') || undefined
    const apiKey = params.get('apiKey') || undefined

    let userType = 'public'
    if (apiKey) {
      try {
        const resp = await fetch('/session/create', {
          method: 'POST',
          headers: { 'X-User-Key': apiKey }
        })
        if (resp.ok) {
          const data = await resp.json()
          userType = data.userType
          console.log('[dev-auth] /session/create ok', { userType })
        } else {
          console.warn('[dev-auth] /session/create failed', { status: resp.status })
        }
      } catch (err) {
        console.error('[dev-auth] /session/create threw', err)
      }
    }

    console.log('[mount] Mounting job-platform', { theme, userType })

    mount(document.getElementById('app'), {
      theme,
      userType
    })
  </script>
</body>
</html>
